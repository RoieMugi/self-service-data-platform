services:
  db:
    image: postgres:15
    container_name: data-platform-db
    environment:
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_pass
      POSTGRES_DB: platform_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: data-platform-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://platform_user:platform_pass@db:5432/platform_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: platform_minio
      MINIO_SECRET_KEY: platform_minio_password
      MINIO_RAW_BUCKET: raw
      MINIO_CURATED_BUCKET: curated
      MINIO_SECURE: "false"
      RABBITMQ_URL: amqp://platform_user:platform_rabbitmq_password@rabbitmq:5672/
      RABBITMQ_QUEUE: processing_runs
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:4-management
    container_name: data-platform-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: platform_user
      RABBITMQ_DEFAULT_PASS: platform_rabbitmq_password
    ports:
      - "127.0.0.1:15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  worker:
    build: .
    container_name: data-platform-worker
    command: python -m app.worker
    environment:
      DATABASE_URL: postgresql://platform_user:platform_pass@db:5432/platform_db
      MINIO_ENDPOINT: minio:9000
      MINIO_ACCESS_KEY: platform_minio
      MINIO_SECRET_KEY: platform_minio_password
      MINIO_RAW_BUCKET: raw
      MINIO_CURATED_BUCKET: curated
      MINIO_SECURE: "false"
      RABBITMQ_URL: amqp://platform_user:platform_rabbitmq_password@rabbitmq:5672/
      RABBITMQ_QUEUE: processing_runs
    depends_on:
      db:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy

  minio:
    image: minio/minio:RELEASE.2025-07-23T15-54-02Z
    container_name: data-platform-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: platform_minio
      MINIO_ROOT_PASSWORD: platform_minio_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5
  minio-init:
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    container_name: data-platform-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 platform_minio platform_minio_password;
      mc mb --ignore-existing local/raw;
      mc mb --ignore-existing local/curated;
      "

  prometheus:
    image: prom/prometheus:v3.14.0
    container_name: data-platform-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus-alerts.yml:/etc/prometheus/prometheus-alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - api

  grafana:
    image: grafana/grafana:12.1.0
    container_name: data-platform-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: platform_grafana_password
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  postgres_data:
  minio_data:
  prometheus_data:
  grafana_data:
  rabbitmq_data:
