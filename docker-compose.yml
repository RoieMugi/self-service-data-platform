services:
  db:
    image: postgres:15
    container_name: data-platform-db
    environment:
      POSTGRES_USER: platform_user
      POSTGRES_PASSWORD: platform_pass
      POSTGRES_DB: platform_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform_user -d platform_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: data-platform-api
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://platform_user:platform_pass@db:5432/platform_db
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data: