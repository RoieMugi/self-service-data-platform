<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1010" viewBox="0 0 1600 1010" role="img" aria-labelledby="title description">
  <title id="title">Self-service batch data platform architecture</title>
  <desc id="description">A client uses FastAPI. PostgreSQL commits run state and an outbox intent together. FastAPI attempts immediate RabbitMQ publication; a reconciler republishes pending intents and recovers expired worker leases. RabbitMQ delivers work to a worker, which claims a leased run and invokes DuckDB to transform raw CSV in PGSTY Silo into curated Parquet. FastAPI uses a bounded DuckDB child process to query curated Parquet. Prometheus collects API and worker metrics for Grafana.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#475569"/>
    </marker>
    <marker id="accent-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M1 1 L9 5 L1 9 Z" fill="#6366f1"/>
    </marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #0f172a; }
      .title { font-size: 30px; font-weight: 700; }
      .subtitle { font-size: 15px; fill: #475569; }
      .section { font-size: 13px; font-weight: 700; letter-spacing: 1.5px; fill: #64748b; }
      .name { font-size: 20px; font-weight: 700; text-anchor: middle; }
      .detail { font-size: 14px; fill: #475569; text-anchor: middle; }
      .small { font-size: 13px; fill: #475569; text-anchor: middle; }
      .label { font-size: 13px; font-weight: 600; fill: #334155; text-anchor: middle; }
      .line { fill: none; stroke: #475569; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#arrow); }
      .both { fill: none; stroke: #475569; stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; marker-start: url(#arrow); marker-end: url(#arrow); }
      .recovery { fill: none; stroke: #6366f1; stroke-width: 2.5; stroke-dasharray: 7 5; stroke-linecap: round; stroke-linejoin: round; marker-end: url(#accent-arrow); }
      .rule { stroke: #e2e8f0; stroke-width: 2; }
    </style>
  </defs>

  <rect width="1600" height="1010" fill="#ffffff"/>
  <text class="title" x="52" y="56">Self-service batch data platform</text>
  <text class="subtitle" x="52" y="84">Local prototype | request, reliable processing, storage, query, and observability</text>
  <line class="rule" x1="52" y1="106" x2="1548" y2="106"/>

  <text class="section" x="52" y="145">SUBMISSION AND RECOVERY</text>
  <path class="recovery" d="M370 199 V178 H1175 V199"/>
  <text class="label" x="773" y="166">FastAPI attempts immediate publication after commit</text>

  <g stroke-width="2">
    <rect x="52" y="200" width="168" height="92" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
    <rect x="280" y="200" width="180" height="92" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
    <rect x="520" y="200" width="230" height="92" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <rect x="810" y="200" width="210" height="92" rx="12" fill="#f5f3ff" stroke="#a78bfa"/>
    <rect x="1080" y="200" width="190" height="92" rx="12" fill="#f5f3ff" stroke="#a78bfa"/>
    <rect x="1330" y="200" width="218" height="92" rx="12" fill="#f5f3ff" stroke="#a78bfa"/>
  </g>
  <g>
    <text class="name" x="136" y="239">Client</text><text class="detail" x="136" y="264">API consumer</text>
    <text class="name" x="370" y="239">FastAPI</text><text class="detail" x="370" y="264">upload | submit | query</text>
    <text class="name" x="635" y="239">PostgreSQL</text><text class="detail" x="635" y="264">metadata | runs | outbox</text>
    <text class="name" x="915" y="233">Reconciler</text><text class="detail" x="915" y="257">republish pending work</text><text class="detail" x="915" y="276">recover expired leases</text>
    <text class="name" x="1175" y="239">RabbitMQ</text><text class="detail" x="1175" y="264">work requests</text>
    <text class="name" x="1439" y="233">Worker</text><text class="detail" x="1439" y="257">claim token</text><text class="detail" x="1439" y="276">lease heartbeat</text>
  </g>
  <path class="line" d="M220 246 H280"/>
  <path class="line" d="M460 246 H520"/>
  <path class="line" d="M750 246 H810"/>
  <path class="line" d="M1020 246 H1080"/>
  <path class="line" d="M1270 246 H1330"/>
  <path class="recovery" d="M1439 292 V350 H635 V292"/>
  <text class="label" x="1037" y="339">Worker claims, renews lease, and finalizes run state</text>

  <line class="rule" x1="52" y1="385" x2="1548" y2="385"/>
  <text class="section" x="52" y="420">ARTIFACT PROCESSING</text>
  <path class="line" d="M324 292 V480"/>
  <text class="label" x="407" y="438">API stores upload</text>
  <path class="line" d="M1505 292 V462 H920 V480"/>
  <text class="label" x="1200" y="447">Worker invokes transformation</text>

  <g stroke-width="2">
    <rect x="270" y="480" width="250" height="92" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
    <rect x="805" y="480" width="230" height="92" rx="12" fill="#fdf2f8" stroke="#f9a8d4"/>
    <rect x="1280" y="480" width="268" height="92" rx="12" fill="#fffbeb" stroke="#fcd34d"/>
  </g>
  <g>
    <text class="name" x="395" y="513">PGSTY Silo</text><text class="detail" x="395" y="538">raw CSV</text><text class="detail" x="395" y="557">S3-compatible storage</text>
    <text class="name" x="920" y="518">DuckDB</text><text class="detail" x="920" y="543">CSV to Parquet transform</text>
    <text class="name" x="1414" y="513">PGSTY Silo</text><text class="detail" x="1414" y="538">curated Parquet</text><text class="detail" x="1414" y="557">S3-compatible storage</text>
  </g>
  <path class="line" d="M520 526 H805"/>
  <text class="label" x="663" y="508">Worker reads CSV</text>
  <path class="line" d="M1035 526 H1280"/>
  <text class="label" x="1158" y="508">Write Parquet</text>

  <line class="rule" x1="52" y1="620" x2="1548" y2="620"/>
  <text class="section" x="52" y="655">QUERY, SAVE, AND DOWNLOAD</text>
  <path class="line" d="M280 268 H245 V758 H650"/>
  <text class="label" x="488" y="746">API sends bounded query</text>
  <rect x="650" y="700" width="330" height="116" rx="12" fill="#eff6ff" stroke="#60a5fa" stroke-width="2"/>
  <text class="name" x="815" y="738">SQL executor</text>
  <text class="detail" x="815" y="764">DuckDB child process</text>
  <text class="small" x="815" y="788">preview | save | CSV export</text>
  <path class="both" d="M1414 572 V788 H980"/>
  <text class="label" x="1200" y="775">Read / save Parquet</text>
  <text class="small" x="1112" y="839">FastAPI also serves original CSV and curated Parquet downloads from Silo.</text>

  <line class="rule" x1="52" y1="875" x2="1548" y2="875"/>
  <text class="section" x="52" y="912">OBSERVABILITY</text>
  <text class="detail" x="375" y="951">API + worker metrics</text>
  <rect x="505" y="917" width="210" height="62" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <rect x="805" y="917" width="190" height="62" rx="12" fill="#f1f5f9" stroke="#94a3b8" stroke-width="2"/>
  <text class="name" x="610" y="956">Prometheus</text>
  <text class="name" x="900" y="956">Grafana</text>
  <path class="line" d="M445 948 H505"/>
  <path class="line" d="M715 948 H805"/>
</svg>
