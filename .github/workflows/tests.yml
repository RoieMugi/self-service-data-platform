name: Tests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m pytest -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Start disposable stack
        run: |
          cp .env.example .env
          docker compose up -d --build db rabbitmq minio-init api worker reconciler
          docker compose ps

      - name: Run full-stack smoke test
        run: python scripts/verify_saved_tables.py

      - name: Verify worker and broker recovery
        env:
          ALLOW_DISPOSABLE_FAULTS: "1"
        run: python scripts/verify_recovery.py

      - name: Capture service logs
        if: always()
        run: docker compose logs --no-color > compose-integration.log

      - name: Upload service logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compose-integration-logs
          path: compose-integration.log

      - name: Remove disposable stack
        if: always()
        run: docker compose down -v --remove-orphans
