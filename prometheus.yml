global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/prometheus-alerts.yml

# API and worker have separate process-local registries; scrape both for outcomes.
scrape_configs:
  - job_name: data-platform-api
    metrics_path: /metrics
    static_configs:
      - targets:
          - api:8000

  - job_name: worker
    static_configs:
      - targets: ["worker:8001"]
